<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The PS5 Store - Experience the Future of Gaming</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/home.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
  </head>
  <body>
    <header class="main-header">
      <nav class="navbar">
        <a href="index.html" class="logo">The PS5 Store</a>
        <ul class="nav-list"></ul>
      </nav>
    </header>

    <main>
      <section class="hero">
        <video class="hero-video" autoplay muted loop playsinline>
          <source
            src="https://assets.playstation.com/ps5-showcase-video.mp4"
            type="video/mp4"
          />
          <img src="images/ps5-hero.jpg" alt="PlayStation 5 Console" />
        </video>
        <div class="hero-content">
          <h1>The PS5 Store</h1>
          <p>Experience the Future of Gaming</p>
          <a href="games.html" class="btn">Explore Games</a>
          <a href="#console-showcase" class="btn">Customize Your Console</a>
        </div>
      </section>

      <section id="console-showcase" class="product-showcase">
        <div class="container">
          <h2>Unleash Next-Gen Power</h2>
          <div class="console-display"></div>

          <h2>Customize Your Control</h2>
          <div class="controllers-display"></div>

          <div style="text-align: center; margin-top: 50px">
            <a href="#" class="btn">View All Accessories</a>
          </div>
        </div>
      </section>
    </main>

    <footer class="main-footer">
      <div class="container">
        <p>&copy; 2025 The PS5 Store. All rights reserved.</p>
        <div class="footer-links">
          <a href="#">Privacy Policy</a> | <a href="#">Terms of Service</a>
        </div>
        <div class="social-links"></div>
      </div>
    </footer>

    <script type="module" src="js/home/main.js"></script>
  </body>
</html>
