<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Testimonials - PS5 Store</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/testimonials.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
  </head>
  <body>
    <header class="main-header">
      <nav class="navbar">
        <a href="index.html" class="logo">PS5 Store</a>
        <ul class="nav-list"></ul>
      </nav>
    </header>

    <main>
      <section class="testimonials-section container">
        <h2>What Our Customers Say</h2>

        <div class="testimonials-grid"></div>

        <div class="testimonial-form-section container">
          <h3>Share Your Experience</h3>
          <form class="testimonial-form">
            <div class="form-group">
              <label for="name">Your Name (or Gamertag)</label>
              <input type="text" id="name" name="name" required />
            </div>
            <div class="form-group">
              <label for="email">Your Email (Optional)</label>
              <input type="email" id="email" name="email" />
            </div>
            <div class="form-group">
              <label for="rating">Your Rating</label>
              <div class="star-rating-input">
                <input
                  type="radio"
                  id="star5"
                  name="rating"
                  value="5"
                  required
                /><label for="star5" title="5 stars"
                  ><i class="fas fa-star"></i
                ></label>
                <input type="radio" id="star4" name="rating" value="4" /><label
                  for="star4"
                  title="4 stars"
                  ><i class="fas fa-star"></i
                ></label>
                <input type="radio" id="star3" name="rating" value="3" /><label
                  for="star3"
                  title="3 stars"
                  ><i class="fas fa-star"></i
                ></label>
                <input type="radio" id="star2" name="rating" value="2" /><label
                  for="star2"
                  title="2 stars"
                  ><i class="fas fa-star"></i
                ></label>
                <input type="radio" id="star1" name="rating" value="1" /><label
                  for="star1"
                  title="1 star"
                  ><i class="fas fa-star"></i
                ></label>
              </div>
            </div>
            <div class="form-group">
              <label for="testimonial">Your Testimonial</label>
              <textarea
                id="testimonial"
                name="testimonial"
                rows="5"
                placeholder="Tell us about your experience..."
                required
              ></textarea>
            </div>
            <button type="submit" class="btn">Submit Testimonial</button>
          </form>
        </div>
      </section>
    </main>

    <footer class="main-footer">
      <div class="container">
        <p>&copy; 2025 PS5 Store. All rights reserved.</p>
        <div class="footer-links">
          <a href="#">Privacy Policy</a> | <a href="#">Terms of Service</a>
        </div>
        <div class="social-links"></div>
      </div>
    </footer>
    <script type="module" src="js/testimonials/main.js"></script>
  </body>
</html>
