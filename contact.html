<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us - PS5 Store</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/contact.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
  </head>
  <body>
    <header class="main-header">
      <nav class="navbar">
        <a href="index.html" class="logo">PS5 Store</a>
        <ul class="nav-list"></ul>
      </nav>
    </header>

    <main>
      <section class="contact-section container">
        <h2>Get in Touch with PS5 Store</h2>

        <div class="contact-grid">
          <div class="contact-info">
            <h3>Contact Information</h3>
            <div class="contact-details"></div>
            <div
              class="social-links"
              style="margin-top: 30px; text-align: left"
            >
              <h4>Follow Us:</h4>
            </div>
          </div>

          <div class="contact-form-container">
            <h3>Send Us a Message</h3>
            <form class="contact-form">
              <div class="form-group">
                <label for="contact-name">Name</label>
                <input type="text" id="contact-name" name="name" required />
              </div>
              <div class="form-group">
                <label for="contact-email">Email</label>
                <input type="email" id="contact-email" name="email" required />
              </div>
              <div class="form-group">
                <label for="contact-subject">Subject</label>
                <input
                  type="text"
                  id="contact-subject"
                  name="subject"
                  required
                />
              </div>
              <div class="form-group">
                <label for="contact-message">Message</label>
                <textarea
                  id="contact-message"
                  name="message"
                  rows="7"
                  required
                ></textarea>
              </div>
              <button type="submit" class="btn">Send Message</button>
            </form>
          </div>
        </div>

        <div class="faq-section container">
          <h3>Frequently Asked Questions</h3>
          <div class="faq-list"></div>
        </div>
      </section>
    </main>

    <footer class="main-footer">
      <div class="container">
        <p>&copy; 2025 PS5 Store. All rights reserved.</p>
        <div class="footer-links">
          <a href="#">Privacy Policy</a> | <a href="#">Terms of Service</a>
        </div>
        <div class="social-links"></div>
      </div>
    </footer>

    <script type="module" src="js/contact/main.js"></script>
  </body>
</html>
