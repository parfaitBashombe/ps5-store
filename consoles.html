<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Games Gallery - PS5 Store</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/consoles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
  </head>
  <body>
    <header class="main-header">
      <nav class="navbar">
        <a href="index.html" class="logo">PS5 Store</a>
        <ul class="nav-list"></ul>
      </nav>
    </header>

    <main>
      <section class="games-gallery container">
        <h2>Explore Our Console Library</h2>

        <div class="filters-search">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="console">Consoles</button>
          <button class="filter-btn" data-filter="controller">
            Controllers
          </button>

          <div class="search-bar">
            <input type="text" placeholder="Search for a console..." />
            <i class="fas fa-search search-icon"></i>
          </div>
        </div>

        <div class="game-grid"></div>
      </section>

      <div id="gameDetailModal" class="game-detail-modal">
        <div class="modal-content">
          <span class="modal-close-btn">×</span>
        </div>
      </div>
    </main>

    <footer class="main-footer">
      <div class="container">
        <p>© 2025 PS5 Store. All rights reserved.</p>
        <div class="footer-links">
          <a href="#">Privacy Policy</a> | <a href="#">Terms of Service</a>
        </div>
        <div class="social-links">
          <a href="#" target="_blank"><i class="fab fa-twitter"></i></a>
          <a href="#" target="_blank"><i class="fab fa-instagram"></i></a>
          <a href="#" target="_blank"><i class="fab fa-youtube"></i></a>
        </div>
      </div>
    </footer>

    <script type="module" src="js/consoles/main.js"></script>
  </body>
</html>
