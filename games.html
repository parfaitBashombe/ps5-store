<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Games Gallery - PS5 Store</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/games.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
  </head>
  <body>
    <header class="main-header">
      <nav class="navbar">
        <a href="index.html" class="logo">PS5 Store</a>
        <ul class="nav-list"></ul>
      </nav>
    </header>

    <main>
      <section class="games-gallery container">
        <h2>Explore Our Game Library</h2>

        <div class="filters-search">
          <button class="filter-btn active" data-filter="all">All Games</button>
          <button class="filter-btn" data-filter="action">Action</button>
          <button class="filter-btn" data-filter="adventure">Adventure</button>
          <button class="filter-btn" data-filter="rpg">RPG</button>
          <button class="filter-btn" data-filter="sci-fi">Sci-Fi</button>
          <button class="filter-btn" data-filter="upcoming">Upcoming</button>
          <button class="filter-btn" data-filter="exclusives">
            Exclusives
          </button>
          <div class="search-bar">
            <input type="text" placeholder="Search for a game..." />
            <i class="fas fa-search search-icon"></i>
          </div>
        </div>

        <div class="game-grid"></div>
      </section>

      <div id="gameDetailModal" class="game-detail-modal">
        <div class="modal-content">
          <span class="modal-close-btn">×</span>
          <div class="modal-media">
            <div class="video-container">
              <iframe
                width="560"
                height="315"
                src=""
                frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen
              ></iframe>
            </div>
            <div class="modal-screenshots"></div>
          </div>
          <div class="modal-details">
            <h2></h2>
            <p></p>
            <p>
              <strong>Genre:</strong> <span class="modal-genre-text"></span>
            </p>
            <p>
              <strong>Release Date:</strong>
              <span class="modal-release-date-text"></span>
            </p>
            <p class="price"></p>
            <a href="#" class="btn">Add to Cart</a>
          </div>
        </div>
      </div>
    </main>

    <footer class="main-footer">
      <div class="container">
        <p>© 2025 PS5 Store. All rights reserved.</p>
        <div class="footer-links">
          <a href="#">Privacy Policy</a> | <a href="#">Terms of Service</a>
        </div>
        <div class="social-links">
          <a href="#" target="_blank"><i class="fab fa-twitter"></i></a>
          <a href="#" target="_blank"><i class="fab fa-instagram"></i></a>
          <a href="#" target="_blank"><i class="fab fa-youtube"></i></a>
        </div>
      </div>
    </footer>

    <script type="module" src="js/games/main.js"></script>
  </body>
</html>
